<main class="container-form">
  <div class="container-title">
    <div class="title">
      <img src="/Academix_logo.png" alt="Logo da Academix" />
      <h1>Crie sua conta</h1>
    </div>

    <div class="subtitle">
      <h3>Cadastre-se para ter acesso</h3>
    </div>
  </div>

  <form action="" class="signup-form">
    <div class="container-inputs">
      <div class="input-container">
        <label for="name">Nome Completo</label>
        <input id="name" name="name" required placeholder="Seu nome" type="text" />
      </div>

      <div class="input-container">
        <label for="birth-date">Data de Nascimento</label>
        <input id="birth-date" name="birth-date" required type="date" required />
      </div>

      <div class="input-container">
        <label for="course">Curso</label>
        <input required id="course" name="course" placeholder="Seu curso" type="text" />
      </div>

      <div class="input-container">
        <label for="email">E-mail</label>
        <input id="email" name="email" required placeholder="Seu email" type="email" />
      </div>

      <div class="input-container">
        <label for="password">Senha</label>
        <input id="password" name="password" required placeholder="Senha" type="password" />
      </div>

      <div class="input-container">
        <label for="repeat-password">Confirmar Senha</label>
        <input
          id="repeat-password"
          name="repeat-password"
          required
          placeholder="Repetir senha"
          type="password"
        />
      </div>
    </div>

    <div class="privacy-policy">
      <label for="privacy-policy">
        <input id="privacy-policy" required type="checkbox" />

        Ao criar uma conta na Academix, concordo com a <a href="#">Política de Privacidade</a>
      </label>
    </div>

    <a class="signup-button" routerLink="/home">CRIAR CONTA</a>

    <label for="">Já tem uma conta? <a routerLink="/login">Entrar</a></label>
  </form>
</main>
