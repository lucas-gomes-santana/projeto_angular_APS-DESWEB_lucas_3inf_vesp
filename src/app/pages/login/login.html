<main class="main-container">
  <div class="login-container">
    <div class="container-title">
      <div class="title">
        <img src="/Academix_logo.jpeg" alt="Logo da Academix" />
        <h1>Bem vindo ao Academix</h1>
      </div>

      <div class="subtitle">
        <h3>Entre na sua conta</h3>
      </div>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" action="">
      <div class="form-group">
        <label for="email">Email:</label>

        <div class="input-container">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-mail preview-icon"
          >
            <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
            <rect x="2" y="4" width="20" height="16" rx="2" />
          </svg>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="Email"
            required
            formControlName="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha:</label>

        <div class="input-container">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-lock preview-icon"
          >
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Senha"
            required
            formControlName="password"
          />
        </div>
      </div>

      @if (
        (form.controls.email.touched && form.controls.email.invalid) ||
        (form.controls.password.touched && form.controls.password.invalid)
      ) {
        <small class="error">E-mail e senha são obrigatórios</small>
      }

      <div class="forgot-password">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox" formControlName="remember" />
          Lembrar-me
        </label>

        <a href="#">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="login-button">ENTRAR</button>

      <p class="signup">
        Não possui login?
        <a routerLink="/signup">Cadastre-se</a>
      </p>
    </form>
  </div>
</main>
